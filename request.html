<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotless Company - Request a Service</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="brand" href="index.html">Spotless Company</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="team.html">Team</a>
      <a href="tools.html">Tools</a>
      <a href="request.html">Request</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <main>
    <section class="request">
      <h1>Request a Service</h1>
      <p class="intro">Fill in your needs and we'll prepare a tailored quote for you.</p>

      <form action="mailto:spotlesscompany@gmail.com" method="POST" enctype="text/plain" class="request-form">
        <label>Full Name
          <input type="text" name="name" required>
        </label>

        <label>Email
          <input type="email" name="email" required>
        </label>

        <label>Phone
          <input type="tel" name="phone">
        </label>

        <label>Service Type
          <select name="service" required>
            <option value="">-- Select --</option>
            <option>Home Cleaning</option>
            <option>Office Cleaning</option>
            <option>Deep Cleaning</option>
            <option>Window Cleaning</option>
            <option>Other</option>
          </select>
        </label>

        <label>Preferred Plan
          <select name="plan">
            <option value="">-- Select --</option>
            <option>Essential (€30/hour)</option>
            <option>Comfort (€35/hour)</option>
            <option>Premium (€40/hour)</option>
          </select>
        </label>

        <label>Preferred Date
          <input type="date" name="date">
        </label>

        <label>Property Size (m²)
          <input type="number" name="size" min="1" placeholder="e.g. 65">
        </label>

        <label>Describe Your Needs
          <textarea name="needs" rows="6" placeholder="Tell us about the space, special requests, frequency, etc." required></textarea>
        </label>

        <button type="submit">Submit Request</button>
      </form>

      <p class="note">Or email us directly at <a href="mailto:spotlesscompany@gmail.com">spotlesscompany@gmail.com</a></p>
    </section>
  </main>

  <footer>© 2026 Spotless Company. All rights reserved.</footer>
</body>
</html>
