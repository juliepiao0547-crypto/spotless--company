<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotless Company - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="brand" href="index.html">Spotless Company</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <main>
    <section class="contact">
      <h1>Contact Us</h1>
      <p>Tell us what you need and we'll get back to you shortly.</p>

      <form action="https://formspree.io/f/你的ID" method="POST">
        <label>Name
          <input type="text" name="name" required>
        </label>
        <label>Email
          <input type="email" name="email" required>
        </label>
        <label>Message
          <textarea name="message" rows="5" required></textarea>
        </label>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>© 2026 Spotless Company. All rights reserved.</footer>
</body>
</html>
